name: Validate Cerneva

on:
  push:
  pull_request:

jobs:
  analytical-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run R pipeline
        run: Rscript R/run_pipeline.R
      - name: Run analytical tests
        run: Rscript tests/run_tests.R
      - name: Rebuild Tableau package
        run: python tableau/build_workbook.py

