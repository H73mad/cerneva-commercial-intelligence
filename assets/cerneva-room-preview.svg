    <rect x="1057" y="650" width="490" height="255" rx="14" fill="#fff" stroke="#e7ddd5"/><text x="1081" y="681" font-size="15" font-weight="700">What changed</text><text x="1081" y="701" font-size="10" fill="#766b70">The useful signal is a pattern, not a single score.</text><circle cx="1095" cy="746" r="14" fill="#f2e3e9"/><text x="1089" y="751" font-size="13" fill="#65183d">↗</text><text x="1120" y="741" font-size="11" font-weight="700">Engaging has the volume</text><text x="1120" y="760" font-size="10" fill="#766b70">1,589 opportunities need a stage-age review.</text><circle cx="1095" cy="809" r="14" fill="#f2e3e9"/><text x="1089" y="814" font-size="13" fill="#65183d">◌</text><text x="1120" y="804" font-size="11" font-weight="700">GTX Pro carries the value</text><text x="1120" y="823" font-size="10" fill="#766b70">$3.51m won revenue with a 37-day cycle.</text><circle cx="1095" cy="872" r="14" fill="#f7dfdf"/><text x="1090" y="877" font-size="13" fill="#b8555b">!</text><text x="1120" y="867" font-size="11" font-weight="700">Data quality is the constraint</text><text x="1120" y="886" font-size="10" fill="#766b70">1,425 open records need context.</text>
